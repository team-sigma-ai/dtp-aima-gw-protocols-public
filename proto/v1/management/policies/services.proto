syntax = "proto3";

package ai.sigmafinancial.aima.v1.management.policy.services;

import "dtp-aima-gw-protocols-shared/proto/common/basic.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/management/policies/messages.proto";

service PolicyManagement {
    // Create a policy from a set of SRN statements
    rpc CreatePolicy (CreatePolicyRequest) returns (CreatePolicyResponse);
    // Fetch a policy by id
    rpc GetPolicy (GetPolicyRequest) returns (GetPolicyResponse);
    // List policies, optionally filtered by owning account
    rpc ListPolicies (ListPoliciesRequest) returns (ListPoliciesResponse);
    // Delete a policy; fails if an App Key is still bound to it
    rpc DeletePolicy (DeletePolicyRequest) returns (.ai.sigmafinancial.aima.common.Empty);
    // Bind an App Key to a policy
    rpc BindAppKey (BindAppKeyRequest) returns (.ai.sigmafinancial.aima.common.Empty);
    // Replace an account's boundary policy (ABP) with a new statement list
    rpc UpdateAccountBoundaryPolicy (UpdateAccountBoundaryPolicyRequest) returns (UpdateAccountBoundaryPolicyResponse);
    // Read an account's boundary policy (ABP) and its effective ceiling
    rpc GetAccountBoundaryPolicy (GetAccountBoundaryPolicyRequest) returns (GetAccountBoundaryPolicyResponse);
}

message GetAccountBoundaryPolicyRequest {
    // The account whose boundary policy is being read
    string account_id = 1;
}

message GetAccountBoundaryPolicyResponse {
    // The account's authored ABP statements (empty if the account is unbounded)
    repeated string statements = 1;
    // The account's materialised effective ceiling
    repeated string effective = 5;
}

// Policy and Statement are defined in shared/proto/v1/management/policies/messages.proto (same package).

message CreatePolicyRequest {
    // The account that will own the policy
    string owner_id = 1;
    // The SRN statements to grant
    repeated string srn = 5;
}

message CreatePolicyResponse {
    // The created policy
    Policy policy = 1;
}

message GetPolicyRequest {
    // The policy to fetch
    string policy_id = 1;
}

message GetPolicyResponse {
    // The requested policy
    Policy policy = 1;
}

message ListPoliciesRequest {
    // Filter to policies owned by this account; empty for all visible
    string owner_id = 1;
}

message ListPoliciesResponse {
    // The matching policies
    repeated Policy policies = 1;
}

message DeletePolicyRequest {
    // The policy to delete
    string policy_id = 1;
}

message BindAppKeyRequest {
    // The App Key to bind
    string app_key_id = 1;
    // The policy to bind it to
    string policy_id = 5;
}

message UpdateAccountBoundaryPolicyRequest {
    // The account whose boundary policy is being replaced
    string account_id = 1;
    // The full SRN statement list that becomes the account's ABP
    repeated string statements = 5;
}

// UpdateAccountBoundaryPolicyResponse is defined in shared/proto/v1/management/policies/messages.proto (same package).
