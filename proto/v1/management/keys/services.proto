syntax = "proto3";

package ai.sigmafinancial.aima.v1.management.key.services;

import "dtp-aima-gw-protocols-public/proto/v1/auth.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/auth.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/management/keys/messages.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/common.proto";

service KeyManagement {
    rpc List (ListKeysRequest) returns (ListKeysResponse);
    rpc Create (CreateKeyRequest) returns (CreateKeyResponse);
    rpc Delete (DeleteKeysRequest) returns (common.Empty);
    rpc IssueToken (IssueTokenRequest) returns (IssueTokenResponse);
    // Verify that a token contains a valid signature. Token should be extracted
    // from auth header in request.
    rpc VerifyToken (common.Empty) returns (VerifyTokenResponse);
}

// Lists the keys that match the given filters, if any
message ListKeysRequest {
    // This field has no effect
    repeated int32 scope = 1 [deprecated = true];
    // Filters the keys by ID if provided
    repeated string id = 2;
    // Filters the keys by when they were created or expire
    int64 created_after = 5;
    int64 expires_before = 10;
    // Filter for keys bound to a policy.
    string policy_id = 20;
}

message ListKeysResponse {
    // The keys that match the request
    repeated auth.AppKey keys = 1;
}

// Creates a new key with the given scope and expiration time (if none is provided, the key will never expire)
// A new key can never have more scope than the one of the key used to create it, only the same or smaller.
message CreateKeyRequest {
    // This field has no effect
    repeated int32 scope = 1 [deprecated = true];
    // The time the key will expire
    int64 expires = 5;
    // The account this key will belong to, it can only be the account used to create it, or a child account
    // If not provided, it will belong to the account that owns the key used to call this endpoint
    string account_id = 10;
    // The policy to bind the key to at creation.
    string policy_id = 20;
}

// CreateKeyResponse is defined in shared/proto/v1/management/keys/messages.proto (same package).

// Deletes the keys with the given key_ids
// This will immediately invalidate the keys
// and any tokens created with them
message DeleteKeysRequest {
    // The keys to delete
    repeated string key_ids = 1;
}

message IssueTokenRequest {
    // The API Key ID to create a token from
    string app_key_id = 1;

    // The current time in epoch seconds, max allowed clock-skew with server is 60 seconds.
    int64 epoch_time = 3;

    // Number used once, sending the request again with the same nonce will be refused.
    int64 nonce = 4;

    // Generate a signature string by concatenating "{app_key_id}{epoch_time}{nonce}"
    // and signing the resulting string with the private key part of the App Key
    string signature = 5;

    // This field has no effect
    repeated int32 scope = 10 [deprecated = true];

    // The duration (in seconds) the token should live for
    int64 life_span = 15;

}

message IssueTokenResponse {
    // The token that was created
    auth.Token token = 1;
}

message VerifyTokenResponse {
    // The token that was verified, serialized as it should appear in an auth header.
    string token = 1;
}
