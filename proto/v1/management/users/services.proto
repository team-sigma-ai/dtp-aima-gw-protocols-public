syntax = "proto3";

package ai.sigmafinancial.aima.v1.management.user.services;

import "dtp-aima-gw-protocols-public/proto/v1/user.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/account.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/management/users/messages.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/common.proto";

// Management of accounts, users, invites and sign-up allow/deny lists
service UserManagement {
    // List accounts
    rpc ListAccounts (ListAccountsRequest) returns (ListAccountsResponse);
    // Create an account
    rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);

    // List users
    rpc ListUsers (ListUsersRequest) returns (ListUserResponse);
    // Delete a user or invite
    rpc DeleteUser (DeleteEntryRequest) returns (common.Empty);

    // List invites
    rpc ListInvites (common.Empty) returns (ListInvitesResponse);
    // Invite a user by email
    rpc InviteUser (InviteUserRequest) returns (common.Empty);
    // Delete an invite
    rpc DeleteInvite (DeleteEntryRequest) returns (common.Empty);

    // List the SSO sign-up allow list or the email deny list
    rpc ListEmailEntryList (ListEmailEntriesRequest) returns (ListEmailEntriesResponse);
    // Add or remove an email or domain on the allow/deny list
    rpc UpdateEmailEntries (EmailListEntryRequest) returns (common.Empty);
}

// Request to list accounts by owner, parent or id
message ListAccountsRequest {
    oneof search_type {
        // List the account that owns the calling App Key
        bool app_key_owner = 1;
        // List child accounts
        ListChildAccounts child_accounts = 2;
        // List specific accounts by id
        ListSpecificAccounts specific_accounts = 3;
    }
}

// A search for child accounts
message ListChildAccounts {
    // The parent to list child accounts under
    string parent_id = 1;
    // How many levels of children to search
    uint32 depth = 2;
}

// A search for specific accounts by id
message ListSpecificAccounts {
    // The account ids to fetch
    repeated string account_id_list = 1;
}

// The matching accounts
message ListAccountsResponse {
    // The matching accounts
    repeated .ai.sigmafinancial.aima.v1.user.Account accounts = 1;
}

// Request to create an account with its boundary policy (ABP)
message CreateAccountRequest {
    // The account to create
    ai.sigmafinancial.aima.v1.user.NewAccount create = 1;
    // The SRN statements that become the account's boundary policy (ABP)
    repeated string statements = 5;
    // The SRN deny statements that become the account's boundary policy (ABP)
    repeated string statement_denies = 10;
}

// Request to list the users that match the given filters
message ListUsersRequest {
    // The scopes to filter by; deprecated
    repeated int32 scope = 1 [deprecated = true];
    // Filter to users created after this time, in Unix epoch seconds
    int64 created_after = 5;
    // Filter users by name
    string name = 10;
    // Filter users by email
    string email = 15;
}

// The users that match the request
message ListUserResponse {
    // The users that match the request
    repeated ai.sigmafinancial.aima.v1.user.User users = 1;
}

// Request to invite a user by email to create an account
message InviteUserRequest {
    // The email of the person to invite
    string email = 1;
    // The name of the person to invite
    string name = 5;
}

// The invites that match the request
message ListInvitesResponse {
    // The invites that match the request
    repeated Invite invites = 1;
}

// An invite
message Invite {
    // The invite id
    string id = 1;
    // The email address that was invited
    string email = 5;
}

// Request to delete a user or invite
message DeleteEntryRequest {
    // The user or invite to delete
    string entry_id = 1;
}

// Request to list the allow or deny list of emails or domains
message ListEmailEntriesRequest {
    // Whether to list the deny list rather than the allow list
    bool deny_list = 1;
}

// The entries on the requested list
message ListEmailEntriesResponse {
    // The emails or domains on the list
    repeated string email_or_domain = 1;
}

// Request to add or remove an entry on the allow or deny list
message EmailListEntryRequest {
    // The domain for the allow list, or email address for the deny list
    string email_or_domain = 1;
    // Whether the entry is on the deny list rather than the allow list
    bool deny_list = 5;
    // Whether to remove the entry rather than add it
    bool delete = 10;
}
