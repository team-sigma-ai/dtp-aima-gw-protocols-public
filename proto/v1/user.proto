syntax = "proto3";

package ai.sigmafinancial.aima.v1.user;

// A user within an account
message User {
    // The user id
    string id = 1;
    // The account the user belongs to
    string account_id = 3;
    // The user's email
    string email = 5;
    // The user's first name
    string first_name = 10;
    // The user's last name
    string last_name = 15;
    // The user's SSO id
    string sso_id = 20;
    // When the user was created, in Unix epoch seconds
    int64 created = 25;
}