syntax = "proto3";

package ai.sigmafinancial.aima.v1.auth;

// A signed token
message Token {
    // The token payload
    TokenData data = 5;
    // The token signature
    string signature = 10;
}

// The contents of a token
message TokenData {
    // The token id
    string id = 1;
    // The id of the server key that signed the token
    string token_signature_id = 5;
    // The App Key the token was created from
    string derived_from = 10;
    // When the token was issued, in Unix epoch seconds
    int64 created = 15;
    // When the token expires, in Unix epoch seconds
    int64 expires = 20;
    // The scopes the token is valid for; deprecated, use v2 `auth.TokenData.policy_id`
    repeated int32 scope = 25 [deprecated = true];
}
