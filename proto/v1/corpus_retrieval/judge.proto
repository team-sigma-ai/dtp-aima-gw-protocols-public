syntax = "proto3";

// Turn judge evaluation for the corpus-retrieval services.
//
// The caller supplies the chat request that produced a turn and that turn's
// terminal event, plus reviewer notes and gold material; the service scores
// the exchange. It never executes agent turns.
//
// The surface is data only: per-criterion, per-judge scores and comments. The
// judge model panel and the criterion set are service-owned, so
// `criterion_id` / `criterion_label` are opaque display keys.
//
// Stream shape: one `ack` immediately after validation, then exactly one
// terminal `result` or `error`, then close OK.
package ai.sigmafinancial.aima.v1.corpus_retrieval.judge;

import "dtp-aima-gw-protocols-public/proto/v1/corpus_retrieval/services.proto";

service CorpusRetrievalJudge {
    // Judge one executed turn: every judge model in the panel scores the turn
    // against every criterion, independently — one 1–5 score plus free-text
    // comments per (criterion, judge).
    rpc CreateTurnJudgeEvaluation (CreateTurnJudgeEvaluationRequest) returns (stream CreateTurnJudgeEvaluationEvent);
}

message CreateTurnJudgeEvaluationRequest {
    // The chat request that produced the judged turn, in its entirety.
    ai.sigmafinancial.aima.v1.corpus_retrieval.services.ChatRequest chat_request = 1;

    // The chat stream's terminal event, verbatim: `result` for a completed
    // turn, `error` for a failed one.
    ai.sigmafinancial.aima.v1.corpus_retrieval.services.ChatEvent final_message = 2;

    // Reviewer context for the judges: what a good answer must and must not do.
    string review_notes = 3;

    // Reference answer. Empty = the judges score without a reference.
    string gold_answer = 4;

    repeated GoldCitation gold_citations = 5;
    repeated GoldVerbatimQuote gold_verbatim_quotes = 6;

    // Replay attaches to the existing evaluation. Required; empty is rejected.
    string idempotency_key = 7;
}

// One document a correct answer cites.
message GoldCitation {
    string document_id = 1;
    optional string quote = 2;     // grounding excerpt
}

// One passage a correct answer reproduces verbatim, quoted and cited.
message GoldVerbatimQuote {
    string document_id = 1;
    optional string quote = 2;     // absent = passage not yet pinned
    optional string rationale = 3;
}

// One streamed evaluation event; exactly one payload is set.
message CreateTurnJudgeEvaluationEvent {
    oneof payload {
        CreateTurnJudgeEvaluationAck ack = 1;      // immediate: request valid, evaluation scheduled or attached
        TurnJudgeEvaluation result = 2;            // terminal success
        // Terminal failure (shared error shape with the chat services).
        ai.sigmafinancial.aima.v1.corpus_retrieval.services.ErrorResult error = 3;
    }
}

// The immediate ack.
message CreateTurnJudgeEvaluationAck {
    string idempotency_key = 1;

    // False: this call scheduled a new evaluation. True: the key matched an
    // existing evaluation and this stream attached to it.
    bool attached = 2;
}

// The one structured evaluation payload: the criterion set, each scored by
// every judge model in the panel.
message TurnJudgeEvaluation {
    repeated CriterionResult criteria = 1;

    // Judge-panel spend for this evaluation, folded by (origin, model). Absent
    // only when no panel call completed.
    optional ai.sigmafinancial.aima.v1.corpus_retrieval.services.TokenUsageSummary usage = 2;
}

// One criterion, scored by the whole panel.
message CriterionResult {
    string criterion_id = 1;      // stable key, e.g. "faithfulness"
    string criterion_label = 2;   // display label
    repeated JudgeResult judges = 3;   // one entry per judge model, panel order
}

// One judge model's outcome for one criterion: a score, or the failure that
// prevented one.
message JudgeResult {
    oneof result {
        JudgeScore score = 1;
        JudgeFailure failure = 2;
    }
}

message JudgeScore {
    string model_id = 1;
    uint32 score = 2;             // 1–5
    string comments = 3;
}

message JudgeFailure {
    string model_id = 1;
    string message = 2;
}
