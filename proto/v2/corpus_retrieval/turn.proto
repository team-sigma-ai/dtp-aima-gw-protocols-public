syntax = "proto3";

// Corpus-retrieval turn API (v2): the durable-turn chat surface.
//
// Unlike v1's `CorpusRetrieval.Chat`, this RPC streams no progress events.
// Stream shape: one `ack` immediately after validation, then exactly one
// terminal `result` or `error`, then close OK.
//
// Idempotency: the request carries an idempotency key. A replayed key attaches
// to the existing turn, running or finished, rather than starting a second
// one; a replayed key whose payload differs from the original is rejected.
package ai.sigmafinancial.aima.v2.corpus_retrieval.turn;

import "dtp-aima-gw-protocols-public/proto/v1/corpus_retrieval/services.proto";

service CorpusRetrievalTurn {
    // Start, or attach to, one turn. The turn runs to completion even if this
    // stream disconnects; a later replay of the same idempotency key receives
    // the same terminal outcome.
    rpc CreateTurn (CreateTurnRequest) returns (stream CreateTurnEvent);

    // Reconnect to a turn's event timeline from a cursor: replays every
    // persisted event past `last_event_id`, then follows live events until the
    // terminal event has been delivered. Unknown turn => NOT_FOUND.
    rpc StreamTurnEvents (StreamTurnEventsRequest) returns (stream StreamTurnEventsEvent);
}

message CreateTurnRequest {
    // The conversation so far, exactly as v1's `ChatRequest.messages`: the
    // client supplies the full history on every call.
    repeated ai.sigmafinancial.aima.v1.corpus_retrieval.services.Message messages = 1;

    // Same contract as v1's `ChatRequest.additional_instructions`.
    optional string additional_instructions = 2;

    // Scopes idempotency and replay-attach. Required; empty is rejected.
    string idempotency_key = 3;
}

// One streamed turn event; exactly one payload is set.
message CreateTurnEvent {
    oneof payload {
        CreateTurnAck ack = 1;    // immediate: request valid, turn scheduled or attached
        TurnResult result = 2;    // terminal success
        // Terminal failure (shared error shape with the v1 chat services).
        ai.sigmafinancial.aima.v1.corpus_retrieval.services.ErrorResult error = 3;
    }
}

// The immediate ack.
message CreateTurnAck {
    string idempotency_key = 1;

    // Server-assigned turn identifier. Stable for a given idempotency_key.
    string turn_id = 2;

    // False: this call scheduled a new turn. True: the key matched an existing
    // turn and this stream attached to it.
    bool attached = 3;
}

// The terminal success payload: the answer, its sources and its attribution.
message TurnResult {
    string content = 1;
    repeated ai.sigmafinancial.aima.v1.corpus_retrieval.services.Source sources = 2;

    // Absent when no attribution stage ran, or when it failed — see `degraded`.
    optional ai.sigmafinancial.aima.v1.corpus_retrieval.services.Attribution attribution = 3;

    // The corpus generation this turn was served from.
    string corpus_generation = 4;

    // True when the answer shipped without a scored attribution. The answer is
    // never retracted on this path, only unscored. `degraded_reason` is set
    // whenever this is true.
    bool degraded = 5;
    string degraded_reason = 6;

    // Set when this result was served from the answer cache: the `turn_id` of
    // the original turn that computed the content. Empty when this turn ran
    // fresh.
    string served_from = 7;

    // All model spend inside this turn, folded by (origin, model). Absent on a
    // cache-served result — the spend happened on the original turn.
    optional ai.sigmafinancial.aima.v1.corpus_retrieval.services.TokenUsageSummary usage = 8;
}

// Reconnect-from-cursor request. `last_event_id` is the client's last-seen
// cursor; 0 = replay from the beginning.
message StreamTurnEventsRequest {
    // The server-assigned turn identifier, from `CreateTurnAck.turn_id`. Either
    // this or `idempotency_key` must resolve to a known turn; `turn_id` takes
    // precedence when both are set.
    string turn_id = 1;
    int64 last_event_id = 2;
    // Alternative turn reference, for a client that only has the key.
    optional string idempotency_key = 3;
}

// One persisted turn event, replayed or streamed live in `event_id` order.
// `event_type` is the taxonomy key; `payload_json` is that event's JSON
// payload verbatim.
message StreamTurnEventsEvent {
    int64 event_id = 1;
    string event_type = 2;
    optional string node_id = 3;
    optional int32 attempt = 4;
    string payload_json = 5;
    optional string corpus_generation = 6;
}
