syntax = "proto3";

package ai.sigmafinancial.aima.v2.management.key.services;

import "dtp-aima-gw-protocols-public/proto/v2/auth.proto";
import "dtp-aima-gw-protocols-shared/proto/common/basic.proto";

// Token issue and verification
service KeyManagement {
    // Issue a token for an App Key
    rpc IssueToken (IssueTokenRequest) returns (IssueTokenResponse);
    // Verify the signature of the token in the request's auth header
    rpc VerifyToken (.ai.sigmafinancial.aima.common.Empty) returns (VerifyTokenResponse);
}

// Request for a token, signed with the App Key's private key
message IssueTokenRequest {
    // The App Key to issue the token from
    string app_key_id = 1;
    // The current time, in Unix epoch seconds
    int64 epoch_time = 3;
    // A number used once
    int64 nonce = 4;
    // The request signature, made with the App Key's private key
    string signature = 5;
    // How long the token lives, in seconds
    int64 life_span = 15;
}

// The issued token
message IssueTokenResponse {
    // The issued token
    auth.Token token = 1;
    // The token data, for introspection
    auth.TokenData token_data = 5;
    // The token as a ready-to-use Base64 string
    string token_string = 10;
}

// The verified token
message VerifyTokenResponse {
    // The verified token, serialised as it appears in an auth header
    string token = 1;
}
