syntax = "proto3";

package ai.sigmafinancial.aima.v2.auth;

// A signed token
message Token {
    // The encoded token data
    string encoded_token_data = 5;
    // The token signature
    string signature = 10;
}

// The contents of a token
message TokenData {
    // The token id
    string id = 1;
    // The id of the server key that signed the token
    string token_signature_id = 5;
    // The App Key the token was created from
    string derived_from = 10;
    // When the token was issued, in Unix epoch seconds
    int64 created = 15;
    // When the token expires, in Unix epoch seconds
    int64 expires = 20;
    // The policies the token's scope resolves to
    repeated string policy_id = 25;
}
